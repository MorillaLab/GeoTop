<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#04050f;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#080a18;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f43f5e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#fb923c;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="topograd" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:0.02"/>
    </linearGradient>
    <linearGradient id="geograd" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f43f5e;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#f43f5e;stop-opacity:0.02"/>
    </linearGradient>
    <filter id="bigblur"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="medblur"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Ambient glow -->
  <ellipse cx="320" cy="350" rx="380" ry="240" fill="#6366f1" opacity="0.07" filter="url(#bigblur)"/>
  <ellipse cx="1050" cy="280" rx="320" ry="220" fill="#f43f5e" opacity="0.06" filter="url(#bigblur)"/>
  <ellipse cx="700" cy="600" rx="220" ry="100" fill="#a78bfa" opacity="0.04" filter="url(#bigblur)"/>

  <!-- ============================================================ -->
  <!-- RIGHT PANEL: Dual pipeline + persistence diagram             -->
  <!-- ============================================================ -->

  <!-- Persistence Diagram (top right) -->
  <!-- Axes -->
  <line x1="820" y1="370" x2="820" y2="190" stroke="#4b5563" stroke-width="1.2"/>
  <line x1="820" y1="370" x2="1000" y2="370" stroke="#4b5563" stroke-width="1.2"/>
  <!-- Diagonal (birth = death) -->
  <line x1="820" y1="370" x2="1000" y2="190" stroke="#374151" stroke-width="0.8" stroke-dasharray="4,3"/>
  <!-- Axis labels -->
  <text x="810" y="183" font-family="'Segoe UI', sans-serif" font-size="11"
        fill="#6b7280" text-anchor="end">death</text>
  <text x="1008" y="374" font-family="'Segoe UI', sans-serif" font-size="11"
        fill="#6b7280">birth</text>
  <text x="908" y="395" font-family="'Segoe UI', sans-serif" font-size="12"
        fill="#6b7280" text-anchor="middle" opacity="0.7">persistence diagram</text>

  <!-- H₀ points (violet — connected components) -->
  <circle cx="835" cy="295" r="6" fill="#6366f1" opacity="0.9" filter="url(#glow)"/>
  <circle cx="848" cy="260" r="7" fill="#818cf8" opacity="0.9" filter="url(#glow)"/>
  <circle cx="862" cy="310" r="5" fill="#6366f1" opacity="0.8"/>
  <circle cx="880" cy="240" r="8" fill="#a78bfa" opacity="0.9" filter="url(#glow)"/>
  <circle cx="900" cy="280" r="5" fill="#6366f1" opacity="0.8"/>
  <circle cx="915" cy="225" r="6" fill="#818cf8" opacity="0.85" filter="url(#glow)"/>
  <circle cx="935" cy="265" r="5" fill="#6366f1" opacity="0.7"/>

  <!-- H₁ points (rose — loops) -->
  <circle cx="845" cy="335" r="5" fill="#f43f5e" opacity="0.85" filter="url(#glow)"/>
  <circle cx="865" cy="355" r="6" fill="#fb7185" opacity="0.8" filter="url(#glow)"/>
  <circle cx="885" cy="340" r="4" fill="#f43f5e" opacity="0.75"/>
  <circle cx="905" cy="350" r="5" fill="#fb7185" opacity="0.8"/>
  <circle cx="928" cy="342" r="4" fill="#f43f5e" opacity="0.7"/>

  <!-- Legend -->
  <circle cx="828" cy="415" r="5" fill="#6366f1" opacity="0.8"/>
  <text x="838" y="419" font-family="'Segoe UI', sans-serif" font-size="11" fill="#6b7280">H₀ (components)</text>
  <circle cx="940" cy="415" r="5" fill="#f43f5e" opacity="0.8"/>
  <text x="950" y="419" font-family="'Segoe UI', sans-serif" font-size="11" fill="#6b7280">H₁ (loops)</text>

  <!-- LKC profiles (bottom right — threshold curves) -->
  <!-- Area curve -->
  <polyline points="820,540 840,525 860,510 880,500 900,492 920,488 940,490 960,498 980,510"
            fill="none" stroke="#f43f5e" stroke-width="2" stroke-opacity="0.6"/>
  <!-- Perimeter curve -->
  <polyline points="820,535 840,530 860,518 880,512 900,508 920,514 940,520 960,528 980,538"
            fill="none" stroke="#fb923c" stroke-width="2" stroke-opacity="0.6"/>
  <!-- Euler characteristic curve -->
  <polyline points="820,548 840,543 860,535 880,528 900,522 920,518 940,516 960,518 980,522"
            fill="none" stroke="#fbbf24" stroke-width="2" stroke-opacity="0.6"/>
  <text x="908" y="570" font-family="'Segoe UI', sans-serif" font-size="11"
        fill="#6b7280" text-anchor="middle" opacity="0.7">LKC threshold profiles (200 steps)</text>
  <!-- LKC legend -->
  <line x1="820" y1="590" x2="840" y2="590" stroke="#f43f5e" stroke-width="2" opacity="0.7"/>
  <text x="845" y="594" font-family="'Segoe UI', sans-serif" font-size="10" fill="#6b7280">Area</text>
  <line x1="885" y1="590" x2="905" y2="590" stroke="#fb923c" stroke-width="2" opacity="0.7"/>
  <text x="910" y="594" font-family="'Segoe UI', sans-serif" font-size="10" fill="#6b7280">Perimeter</text>
  <line x1="960" y1="590" x2="980" y2="590" stroke="#fbbf24" stroke-width="2" opacity="0.7"/>
  <text x="985" y="594" font-family="'Segoe UI', sans-serif" font-size="10" fill="#6b7280">χ</text>

  <!-- Dual-pipeline mini diagram (top right) -->
  <!-- Input image (placeholder) -->
  <rect x="1030" y="90" width="70" height="70" rx="6"
        fill="#0d0f1f" stroke="#4b5563" stroke-width="1.2"/>
  <!-- Pixel grid suggestion -->
  <g stroke="#374151" stroke-width="0.5" opacity="0.5">
    <line x1="1030" y1="113" x2="1100" y2="113"/>
    <line x1="1030" y1="136" x2="1100" y2="136"/>
    <line x1="1030" y1="159" x2="1100" y2="159"/>
    <line x1="1053" y1="90" x2="1053" y2="160"/>
    <line x1="1076" y1="90" x2="1076" y2="160"/>
  </g>
  <text x="1065" y="175" font-family="'Segoe UI', sans-serif" font-size="11"
        fill="#6b7280" text-anchor="middle">224×224</text>

  <!-- Fork arrows -->
  <path d="M 1065 183 L 1065 200 L 1040 218" stroke="#4b5563" stroke-width="1.2"
        fill="none"/>
  <path d="M 1065 200 L 1090 218" stroke="#4b5563" stroke-width="1.2" fill="none"/>

  <!-- Topo path box -->
  <rect x="1010" y="220" width="58" height="30" rx="6"
        fill="url(#topograd)" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.8"/>
  <text x="1039" y="240" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600"
        fill="#a78bfa" text-anchor="middle">TDA</text>

  <!-- Geo path box -->
  <rect x="1082" y="220" width="58" height="30" rx="6"
        fill="url(#geograd)" stroke="#f43f5e" stroke-width="1.2" stroke-opacity="0.8"/>
  <text x="1111" y="240" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600"
        fill="#fb7185" text-anchor="middle">LKC</text>

  <!-- Feature count labels -->
  <text x="1039" y="265" font-family="'Segoe UI', sans-serif" font-size="10"
        fill="#6366f1" text-anchor="middle" opacity="0.8">64 feats</text>
  <text x="1111" y="265" font-family="'Segoe UI', sans-serif" font-size="10"
        fill="#f43f5e" text-anchor="middle" opacity="0.8">120 feats</text>

  <!-- Merge arrows -->
  <path d="M 1039 268 L 1039 285 L 1075 300" stroke="#4b5563" stroke-width="1.2" fill="none"/>
  <path d="M 1111 268 L 1111 285 L 1075 300" stroke="#4b5563" stroke-width="1.2" fill="none"/>

  <!-- Fusion box -->
  <rect x="1045" y="302" width="62" height="30" rx="6"
        fill="#0d0f1f" stroke="#a78bfa" stroke-width="1.5" stroke-opacity="0.9"/>
  <text x="1076" y="322" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700"
        fill="#c4b5fd" text-anchor="middle">Fusion</text>
  <text x="1076" y="348" font-family="'Segoe UI', sans-serif" font-size="10"
        fill="#6b7280" text-anchor="middle">184 → 100</text>

  <!-- Final arrow + RF -->
  <line x1="1076" y1="350" x2="1076" y2="368" stroke="#4b5563" stroke-width="1.2"/>
  <rect x="1045" y="370" width="62" height="30" rx="6"
        fill="#0d0f1f" stroke="#fbbf24" stroke-width="1.2" stroke-opacity="0.7"/>
  <text x="1076" y="390" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600"
        fill="#fde68a" text-anchor="middle">RF 500t</text>
  <text x="1076" y="415" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700"
        fill="#4ade80" text-anchor="middle">87% ✓</text>

  <!-- ============================================================ -->
  <!-- LEFT PANEL: text content                                     -->
  <!-- ============================================================ -->

  <!-- Vertical accent bar -->
  <rect x="62" y="88" width="5" height="190" rx="3" fill="url(#accent)"/>

  <!-- Title -->
  <text x="88" y="155" font-family="'Segoe UI', system-ui, -apple-system, sans-serif"
        font-size="96" font-weight="900" fill="white" letter-spacing="-3">GeoTop</text>

  <!-- Subtitle -->
  <text x="90" y="196" font-family="'Segoe UI', system-ui, sans-serif"
        font-size="18" fill="#a78bfa" letter-spacing="0.2">
    Geometric-Topological Image Classification
  </text>
  <text x="90" y="220" font-family="'Segoe UI', system-ui, sans-serif"
        font-size="15" fill="#6b7280">
    Lipschitz-Killing Curvatures  ·  Persistent Homology  ·  Feature Fusion
  </text>

  <!-- Divider -->
  <rect x="88" y="240" width="490" height="2" rx="1" fill="url(#accent)"/>

  <!-- Stat boxes -->
  <rect x="88" y="258" width="115" height="80" rx="10"
        fill="#ffffff" fill-opacity="0.03" stroke="#6366f1" stroke-width="1" stroke-opacity="0.6"/>
  <text x="145" y="299" font-family="'Segoe UI', system-ui, sans-serif"
        font-size="30" font-weight="800" fill="#818cf8" text-anchor="middle">87%</text>
  <text x="145" y="327" font-family="'Segoe UI', system-ui, sans-serif"
        font-size="12" fill="#6b7280" text-anchor="middle">Accuracy</text>

  <rect x="216" y="258" width="115" height="80" rx="10"
        fill="#ffffff" fill-opacity="0.03" stroke="#f43f5e" stroke-width="1" stroke-opacity="0.5"/>
  <text x="273" y="296" font-family="'Segoe UI', system-ui, sans-serif"
        font-size="22" font-weight="700" fill="#fb7185" text-anchor="middle">↓15–18%</text>
  <text x="273" y="315" font-family="'Segoe UI', system-ui, sans-serif"
        font-size="11" fill="#6b7280" text-anchor="middle">false positives</text>
  <text x="273" y="330" font-family="'Segoe UI', system-ui, sans-serif"
        font-size="11" fill="#6b7280" text-anchor="middle">&amp; negatives</text>

  <rect x="344" y="258" width="115" height="80" rx="10"
        fill="#ffffff" fill-opacity="0.03" stroke="#a78bfa" stroke-width="1" stroke-opacity="0.5"/>
  <text x="401" y="296" font-family="'Segoe UI', system-ui, sans-serif"
        font-size="22" font-weight="700" fill="#c4b5fd" text-anchor="middle">184</text>
  <text x="401" y="315" font-family="'Segoe UI', system-ui, sans-serif"
        font-size="12" fill="#6b7280" text-anchor="middle">features</text>
  <text x="401" y="330" font-family="'Segoe UI', system-ui, sans-serif"
        font-size="11" fill="#4b5563" text-anchor="middle">64 + 120</text>

  <rect x="472" y="258" width="115" height="80" rx="10"
        fill="#ffffff" fill-opacity="0.03" stroke="#fbbf24" stroke-width="1" stroke-opacity="0.5"/>
  <text x="529" y="296" font-family="'Segoe UI', system-ui, sans-serif"
        font-size="20" font-weight="700" fill="#fde68a" text-anchor="middle">&lt;0.5s</text>
  <text x="529" y="315" font-family="'Segoe UI', system-ui, sans-serif"
        font-size="12" fill="#6b7280" text-anchor="middle">per image</text>
  <text x="529" y="330" font-family="'Segoe UI', system-ui, sans-serif"
        font-size="11" fill="#4b5563" text-anchor="middle">224×224px</text>

  <!-- Tag pills -->
  <g font-family="'Segoe UI', system-ui, sans-serif" font-size="13">
    <rect x="88" y="360" width="130" height="28" rx="14"
          fill="#6366f1" fill-opacity="0.12" stroke="#6366f1" stroke-width="1" stroke-opacity="0.5"/>
    <text x="153" y="379" fill="#a78bfa" text-anchor="middle">🌀 TDA / PH</text>

    <rect x="230" y="360" width="155" height="28" rx="14"
          fill="#f43f5e" fill-opacity="0.10" stroke="#f43f5e" stroke-width="1" stroke-opacity="0.5"/>
    <text x="307" y="379" fill="#fda4af" text-anchor="middle">📐 LK Curvatures</text>

    <rect x="397" y="360" width="140" height="28" rx="14"
          fill="#a78bfa" fill-opacity="0.10" stroke="#a78bfa" stroke-width="1" stroke-opacity="0.5"/>
    <text x="467" y="379" fill="#c4b5fd" text-anchor="middle">🖼 Image ML</text>

    <rect x="549" y="360" width="115" height="28" rx="14"
          fill="#fbbf24" fill-opacity="0.10" stroke="#fbbf24" stroke-width="1" stroke-opacity="0.5"/>
    <text x="606" y="379" fill="#fde68a" text-anchor="middle">arXiv 2023</text>
  </g>

  <!-- Math formula strip -->
  <rect x="88" y="412" width="460" height="42" rx="8"
        fill="#04050f" stroke="#6366f1" stroke-width="1" stroke-opacity="0.3"/>
  <text x="104" y="429" font-family="'Courier New', monospace" font-size="12" fill="#6366f1" opacity="0.6">
    H₀, H₁(X)  ·  χ = #comp − #holes
  </text>
  <text x="104" y="447" font-family="'Courier New', monospace" font-size="12" fill="#f43f5e" opacity="0.6">
    LKC: Area · Perimeter · Euler χ  →  184-dim feature vector
  </text>

  <!-- Related repos -->
  <text x="88" y="482" font-family="'Segoe UI', system-ui, sans-serif"
        font-size="12" fill="#4b5563">
    Used in:
  </text>
  <text x="136" y="482" font-family="'Segoe UI', system-ui, sans-serif"
        font-size="12" fill="#818cf8">TaelCore</text>
  <text x="202" y="482" font-family="'Segoe UI', system-ui, sans-serif"
        font-size="12" fill="#4b5563">·</text>
  <text x="212" y="482" font-family="'Segoe UI', system-ui, sans-serif"
        font-size="12" fill="#86efac">S2-PEPANALYST</text>
  <text x="330" y="482" font-family="'Segoe UI', system-ui, sans-serif"
        font-size="12" fill="#4b5563">·</text>
  <text x="340" y="482" font-family="'Segoe UI', system-ui, sans-serif"
        font-size="12" fill="#67e8f9">TopoAttention</text>

  <!-- Bottom label -->
  <text x="88" y="562" font-family="'Segoe UI', system-ui, sans-serif"
        font-size="14" fill="#374151">
    MorillaLab · arXiv:2311.16157 · CC BY-NC-ND 4.0 / GPL-3.0
  </text>
  <text x="88" y="582" font-family="'Segoe UI', system-ui, sans-serif"
        font-size="13" fill="#374151">
    Abaach · Morilla
  </text>
</svg>
