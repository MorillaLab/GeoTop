name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1-mesa-glx  # OpenCV headless dependency

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 pytest

    - name: Lint with flake8
      run: |
        flake8 Code/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 Code/ --count --max-line-length=127 --statistics

    - name: Check imports
      run: |
        python -c "import numpy, pandas, scipy, sklearn, PIL, cv2; print('Core imports OK')"
        python -c "import gudhi; print('gudhi OK')"
      continue-on-error: false

    - name: Run tests
      run: |
        pytest tests/ -v --tb=short
